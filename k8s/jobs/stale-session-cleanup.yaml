# Complete game_sessions that have been `active` far longer than any real match runs —
# the signature of a reportMatchResult that never landed.
#
# Age is the only test. This job used to keep one active session per mode_queue_id and
# complete the rest, but mode_queues is catalog configuration created once per
# (mode, name) and reused by every match on that mode, so concurrent matches on one queue
# are normal. Keying on it ended live games mid-play (JQ-171).
#
# It also ran as raw psql that only flipped the status, skipping the participant queue-row
# cancellation and room-table reset — manufacturing the very orphans the stale matched
# queue sweep (JQ-133) exists to clear. It now runs the backend image and goes through
# store.CompleteSession, so a swept session gets the whole completion in one transaction.
#
# See docs/lobby-maintenance.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lobby-stale-session-cleanup
  namespace: joinquest
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: sessionsweep
              image: docker.io/scruffyprodigy/joinquest-backend:latest
              command: ["./sessionsweep"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: pg-dsn
                      key: DATABASE_URL
                # How long a session may stay active before this job treats it as stuck.
                # Deliberately far above any match in the catalog: a stuck session waiting
                # one more tick costs a player nothing, ending a live one loses their game.
                # Defaults to 6h in code. Tune here without a code change.
                - name: STALE_SESSION_AGE
                  value: "6h"
