# One-shot: keep catalog handoff URLs and demo game modes aligned with production.
#
# This job owns ONLY what its name promises -- environment-specific handoff URLs
# and the mode/seat/queue rows. Catalog identity (slug, name, description, art,
# tags) belongs to migration 000050_catalog_identity_by_slug and must not be
# written here: this job runs after migrations on every deploy, so anything it
# sets silently overrides them. That is exactly how JQ-203 shipped two Rock
# Paper Scissors cards to production.
apiVersion: batch/v1
kind: Job
metadata:
  name: lobby-patch-game-handoff-urls
  namespace: joinquest
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: patch
          image: postgres:16-alpine
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pg-dsn
                  key: DATABASE_URL
          command:
            - sh
            - -ec
            - |
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
              -- Word Hunt (seed id ...0001, slug word-hunt).
              UPDATE games
              SET api_base_url = 'https://word-hunt-arena.win'
              WHERE id = 'a1000000-0000-4000-8000-000000000001';

              -- Rock Paper Scissors Lizard Robot (seed id ...0002).
              UPDATE games
              SET api_base_url = 'https://rpsls-duel.win'
              WHERE id = 'a1000000-0000-4000-8000-000000000002';

              INSERT INTO game_modes (id, game_id, mode_key, display_name, min_players, max_players, seat_template, status)
              VALUES (
                  'a2000000-0000-4000-8000-000000000002',
                  'a1000000-0000-4000-8000-000000000002',
                  'duel',
                  '1v1 Duel',
                  2,
                  2,
                  '{"count": 2}'::jsonb,
                  'active'
              )
              ON CONFLICT (game_id, mode_key) DO UPDATE SET
                  display_name = EXCLUDED.display_name,
                  min_players = EXCLUDED.min_players,
                  max_players = EXCLUDED.max_players,
                  seat_template = EXCLUDED.seat_template,
                  status = 'active',
                  updated_at = NOW();

              INSERT INTO game_mode_seats (mode_id, seat_key, sort_order)
              VALUES
                  ('a2000000-0000-4000-8000-000000000002', '1', 0),
                  ('a2000000-0000-4000-8000-000000000002', '2', 1)
              ON CONFLICT (mode_id, seat_key) DO NOTHING;

              INSERT INTO mode_queues (id, mode_id, name, players_to_start, status, is_default)
              VALUES (
                  'a3000000-0000-4000-8000-000000000002',
                  'a2000000-0000-4000-8000-000000000002',
                  'Default',
                  2,
                  'active',
                  true
              )
              ON CONFLICT (mode_id, name) DO UPDATE SET
                  players_to_start = EXCLUDED.players_to_start,
                  status = 'active',
                  is_default = true,
                  updated_at = NOW();
              SQL
