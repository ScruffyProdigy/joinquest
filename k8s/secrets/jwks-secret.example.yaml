# Copy to jwks-secret.yaml and replace with generated values:
#   cd backend && go run ./scripts/jwks.go -yamlout ../k8s/secrets/jwks-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: jwks
  namespace: joinquest
type: Opaque
stringData:
  KID: lobby-dev
  PUB_X: REPLACE_WITH_GENERATED_PUB_X
  PRIV_PEM: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_GENERATED_PRIVATE_KEY
    -----END PRIVATE KEY-----
