apiVersion: v1
kind: Service
metadata:
  name: pg
  namespace: playhub
  labels:
    app: pg
spec:
  selector:
    app: pg
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pg
  namespace: playhub
spec:
  serviceName: pg
  replicas: 1
  selector:
    matchLabels:
      app: pg
  template:
    metadata:
      labels:
        app: pg
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: pg
              containerPort: 5432
          envFrom:
            - secretRef:
                name: pg-auth     # contains POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
          env:
            # PVC roots often contain lost+found; use a subdir so initdb succeeds (common on GKE).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              # Sized from observed usage (~1m CPU / 45Mi); limits allow burst.
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app: pg
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
