apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobby-redis
  namespace: joinquest
  labels: { app: lobby-redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: lobby-redis } }
  template:
    metadata:
      labels: { app: lobby-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-redis
  namespace: joinquest
spec:
  selector: { app: lobby-redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
