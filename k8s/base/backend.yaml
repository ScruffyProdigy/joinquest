apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobby-backend
  namespace: joinquest
  labels: { app: lobby-backend }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: lobby-backend } }
  template:
    metadata:
      labels: { app: lobby-backend }
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: backend
          image: docker.io/scruffyprodigy/joinquest-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pg-dsn
                  key: DATABASE_URL
            - name: JWKS_KID
              valueFrom:
                secretKeyRef:
                  name: jwks
                  key: KID
            - name: JWT_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: jwks
                  key: PRIV_PEM
            - name: SPIRIT_AVATAR_STORAGE_DIR
              value: /var/lib/spirit-avatars
            - name: REDIS_URL
              value: redis://lobby-redis:6379/0
            # The joinquest-db-migrate Job owns migrations here. Two writers on
            # schema_migrations race and can leave it dirty; local dev leaves
            # this unset and migrates on boot.
            - name: RUN_STARTUP_MIGRATIONS
              value: "false"
          volumeMounts:
            - name: spirit-avatars
              mountPath: /var/lib/spirit-avatars
          # The kubelet skips liveness and readiness until the startup probe
          # succeeds, so a slow boot cannot be killed part-way through. 60 x 5s
          # gives startup 5 minutes; liveness then guards the steady state.
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
      volumes:
        - name: spirit-avatars
          persistentVolumeClaim:
            claimName: spirit-avatars
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spirit-avatars
  namespace: joinquest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: lobby-backend
  namespace: joinquest
spec:
  selector: { app: lobby-backend }
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
