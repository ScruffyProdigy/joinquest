# GKE joinquest namespace — public URL https://joinquest.cc (see joinquest-ingress.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: lobby-frontend-config
  namespace: joinquest
  labels: { env: joinquest }
data:
  REACT_APP_ENV: production
  REACT_APP_API_BASE_URL: "https://joinquest.cc"
  REACT_APP_STYLE_PREVIEW: "true"
