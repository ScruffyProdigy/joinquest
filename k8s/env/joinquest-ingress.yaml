# Ingress for GKE + NGINX Ingress + cert-manager.
# Prereqs: cert-manager, cluster-issuer-letsencrypt-prod.yaml, joinquest-certificate.yaml,
# and DNS for joinquest.cc -> ingress IP (Cloudflare proxy OK).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lobby
  namespace: joinquest
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - joinquest.cc
      secretName: joinquest-cc-tls
  rules:
    - host: joinquest.cc
      http:
        paths:
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: lobby-backend
                port:
                  number: 80
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: lobby-backend
                port:
                  number: 80
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: lobby-backend
                port:
                  number: 80
          - path: /spirit-avatars
            pathType: Prefix
            backend:
              service:
                name: lobby-backend
                port:
                  number: 80
          # Guest sigils are rendered per colour by the backend; everything else
          # under /avatars is a static file served by the frontend.
          - path: /avatars/sigils
            pathType: Prefix
            backend:
              service:
                name: lobby-backend
                port:
                  number: 80
          - path: /auth/oauth/complete
            pathType: Exact
            backend:
              service:
                name: lobby-frontend
                port:
                  number: 80
          - path: /auth/oauth
            pathType: Prefix
            backend:
              service:
                name: lobby-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lobby-frontend
                port:
                  number: 80
