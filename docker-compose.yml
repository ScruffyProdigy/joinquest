# Shared PostgreSQL for local development and test scripts.
# Credentials match k8s/secrets/*.example.yaml and CI service containers.
#
# Host ports default to 0, which asks Docker for an ephemeral port, so several
# working copies can run this stack at once (JQ-128). Discover the real port
# with `./scripts/db.sh url`, or pin one with LOBBY_POSTGRES_HOST_PORT /
# LOBBY_REDIS_HOST_PORT when you need a fixed address for an external client.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-pass
      POSTGRES_DB: playhub
    ports:
      - "${LOBBY_POSTGRES_HOST_PORT:-0}:5432"
    volumes:
      - playhub_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d playhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${LOBBY_REDIS_HOST_PORT:-0}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  playhub_pgdata:
