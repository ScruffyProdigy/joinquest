name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/internal/auth/**'
      - 'backend/internal/formingworker/**'
      - 'backend/internal/gameurl/**'
      - 'backend/internal/pubsub/**'
      - 'backend/internal/store/**'
      - 'backend/graph/**'
      - 'backend/migrations/**'
      - 'docker-compose.yml'
      - 'scripts/db.sh'
      - 'scripts/e2e-auth-stack.sh'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'backend/internal/auth/**'
      - 'backend/internal/formingworker/**'
      - 'backend/internal/gameurl/**'
      - 'backend/internal/pubsub/**'
      - 'backend/internal/store/**'
      - 'backend/graph/**'
      - 'backend/migrations/**'
      - 'docker-compose.yml'
      - 'scripts/db.sh'
      - 'scripts/e2e-auth-stack.sh'
      - '.github/workflows/frontend-tests.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run linter
      run: |
        cd frontend
        npm run lint
    
    - name: Run unit tests
      run: |
        cd frontend
        npm run test:run -- src/

    - name: Verify required integration check parity
      run: |
        cd frontend
        npm run test:integration-checks
    
    - name: Run unit tests with coverage
      run: |
        cd frontend
        npm run test:coverage -- src/

  e2e-tests:
    runs-on: ubuntu-latest
    env:
      REACT_APP_ENV: test
      REACT_APP_API_BASE_URL: http://localhost:8081
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps
    
    - name: Build application
      run: |
        cd frontend
        npm run build
    
    - name: Run build verification tests
      run: |
        cd frontend
        npm run test:run -- tests/build-verification.test.js
    
    - name: Run E2E tests
      run: |
        cd frontend
        npm run preview &
        SERVER_PID=$!
        
        cleanup() {
          kill $SERVER_PID 2>/dev/null || true
        }
        trap cleanup EXIT
        
        for i in {1..30}; do
          if curl -s http://localhost:4173 > /dev/null; then
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Server failed to start after 30 seconds"
            exit 1
          fi
          sleep 1
        done
        
        BASE_URL=http://localhost:4173 npx playwright test --config=playwright.config.ci.js tests/e2e/basic.spec.js tests/e2e/environment-config.spec.js
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

  auth-e2e-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://app:app-pass@127.0.0.1:5432/playhub?sslmode=disable
      BASE_URL: http://127.0.0.1:5173
      MAGIC_LINK_BASE_URL: http://127.0.0.1:5173/auth/complete?token=
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      E2E_SIGNIN_LOG_PATH: ${{ github.workspace }}/tmp/e2e-sign-in.log

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app-pass
          POSTGRES_DB: playhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d playhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
        cache-dependency-path: backend/go.sum

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install backend dependencies
      run: |
        cd backend
        go mod download

    - name: Run database migrations
      run: |
        cd backend
        make migrate-up

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Start backend
      run: |
        mkdir -p tmp
        : > tmp/e2e-backend.log
        : > tmp/e2e-sign-in.log
        cd backend
        go build -o ../tmp/lobby-backend server.go
        stdbuf -oL -eL ../tmp/lobby-backend >> ../tmp/e2e-backend.log 2>&1 &
        echo $! > ../backend.pid

    - name: Start frontend dev server
      run: |
        cd frontend
        npm run dev -- --host 127.0.0.1 --port 5173 &
        echo $! > ../frontend.pid

    - name: Wait for auth E2E stack
      run: |
        for i in {1..120}; do
          if curl -sf http://127.0.0.1:8080/healthz >/dev/null && { curl -sf http://127.0.0.1:5173 >/dev/null 2>&1 || curl -sf http://localhost:5173 >/dev/null; }; then
            echo "Auth E2E stack is ready"
            exit 0
          fi
          sleep 1
        done
        echo "Auth E2E stack failed to become ready"
        tail -n 50 tmp/e2e-backend.log || true
        exit 1

    - name: Run auth and game loop E2E tests
      run: |
        cd frontend
        npm run test:e2e:auth
        npm run test:e2e:game-loop
      env:
        E2E_SIGNIN_LOG_PATH: ${{ github.workspace }}/tmp/e2e-sign-in.log

    - name: Stop auth E2E stack
      if: always()
      run: |
        if [ -f backend.pid ]; then
          kill "$(cat backend.pid)" 2>/dev/null || true
        fi
        if [ -f frontend.pid ]; then
          kill "$(cat frontend.pid)" 2>/dev/null || true
        fi

    - name: Upload auth E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-auth-report
        path: frontend/playwright-report/
        retention-days: 30

  all-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, auth-e2e-tests]
    
    steps:
    - name: All tests passed
      run: echo "✅ All frontend tests passed successfully!"
