name: Environment Configuration Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'k8s/**'
      - 'docker-compose.yml'
      - 'scripts/db.sh'
      - 'docs/environment-configuration.md'
      - '.github/workflows/environment-config-test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'k8s/**'
      - 'docker-compose.yml'
      - 'scripts/db.sh'
      - 'docs/environment-configuration.md'
      - '.github/workflows/environment-config-test.yml'

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install kubeconform
      run: |
        curl -sfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
          | tar xz kubeconform

    - name: Validate docker compose configuration
      run: docker compose config --quiet

    - name: Validate Kubernetes manifests
      run: |
        for dir in k8s/base k8s/jobs; do
          ./kubeconform -summary -kubernetes-version 1.30.0 -ignore-missing-schemas "$dir"
        done
        for file in k8s/env/*.yaml k8s/secrets/pg-auth.example.yaml k8s/secrets/pg-dsn.example.yaml; do
          ./kubeconform -summary -kubernetes-version 1.30.0 -ignore-missing-schemas "$file"
        done

  test-environment-config:
    runs-on: ubuntu-latest
    env:
      REACT_APP_ENV: test
      REACT_APP_API_BASE_URL: http://localhost:8081
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Install Playwright Browsers
      run: |
        cd frontend
        npx playwright install --with-deps
    
    - name: Build application
      run: |
        cd frontend
        npm run build
    
    - name: Test environment configuration
      run: |
        cd frontend
        npm run preview &
        SERVER_PID=$!
        
        cleanup() {
          kill $SERVER_PID 2>/dev/null || true
        }
        trap cleanup EXIT
        
        for i in {1..30}; do
          if curl -s http://localhost:4173 > /dev/null; then
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Server failed to start after 30 seconds"
            exit 1
          fi
          sleep 1
        done
        
        BASE_URL=http://localhost:4173 npx playwright test --config=playwright.config.env.js tests/e2e/environment-config.spec.js
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: environment-config-test-results
        path: frontend/playwright-report/
        retention-days: 30

  test-docker-environment-injection:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build frontend Docker image
      run: |
        docker build -t playhub-frontend:test frontend/
    
    - name: Test environment injection in Docker
      run: |
        # Test that the Docker entrypoint script works
        docker run --rm -e REACT_APP_ENV=test -e REACT_APP_API_BASE_URL=http://test-api playhub-frontend:test sh -c '
          /docker-entrypoint.d/30-env-injection.sh
          cat /usr/share/nginx/html/env.js
        ' | grep -q "REACT_APP_ENV.*test"
    
    - name: Test different environment configurations
      run: |
        # Test staging environment
        docker run --rm -e REACT_APP_ENV=staging -e REACT_APP_API_BASE_URL=https://api-staging.playhub.com playhub-frontend:test sh -c '
          /docker-entrypoint.d/30-env-injection.sh
          cat /usr/share/nginx/html/env.js
        ' | grep -q "staging"
        
        # Test production environment
        docker run --rm -e REACT_APP_ENV=production -e REACT_APP_API_BASE_URL=https://api.playhub.com playhub-frontend:test sh -c '
          /docker-entrypoint.d/30-env-injection.sh
          cat /usr/share/nginx/html/env.js
        ' | grep -q "production"

  test-kubernetes-configmaps:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Kubernetes ConfigMaps
      run: |
        # Test that environment ConfigMaps exist and have basic YAML structure
        for config_file in k8s/env/*.yaml; do
          if ! grep -q '^kind: ConfigMap' "$config_file"; then
            continue
          fi
          echo "Validating $config_file"
          if [ ! -f "$config_file" ]; then
            echo "❌ ConfigMap file not found: $config_file"
            exit 1
          fi
          # Basic YAML validation - check for key YAML indicators
          if ! grep -q "kind:" "$config_file" || ! grep -q "metadata:" "$config_file"; then
            echo "❌ Invalid YAML structure in $config_file"
            exit 1
          fi
        done
        echo "✅ All ConfigMaps have valid structure"
    
    - name: Validate environment variables in ConfigMaps
      run: |
        # Check that frontend ConfigMaps have required environment variables
        for env_file in k8s/env/*.yaml; do
          if ! grep -q '^kind: ConfigMap' "$env_file"; then
            continue
          fi
          echo "Validating $env_file"
          grep -q "REACT_APP_ENV" "$env_file" || (echo "Missing REACT_APP_ENV in $env_file" && exit 1)
          grep -q "REACT_APP_API_BASE_URL" "$env_file" || (echo "Missing REACT_APP_API_BASE_URL in $env_file" && exit 1)
        done
        grep -q "lobby-frontend-config" k8s/base/frontend.yaml || (echo "Missing frontend ConfigMap in base" && exit 1)
        grep -q "configMapRef" k8s/base/frontend.yaml || (echo "Frontend base must load env from ConfigMap" && exit 1)
        grep -A2 'path: /.well-known' k8s/base/ingress.yaml | grep -q 'pathType: Prefix' || (echo "JWKS ingress path must use Prefix" && exit 1)
        grep -q "secretKeyRef" k8s/base/backend.yaml || (echo "Backend must load JWKS secret" && exit 1)
    
    - name: Test deployment scripts
      run: |
        # Test that deployment scripts are executable and valid
        chmod +x scripts/deploy-*.sh scripts/install-joinquest-*.sh scripts/lib/joinquest-*.sh \
          scripts/check-developer-docs-sync.sh scripts/ship-joinquest.sh scripts/sync-developer-docs.sh
        for script in scripts/deploy-*.sh scripts/install-joinquest-*.sh scripts/lib/joinquest-*.sh \
          scripts/check-developer-docs-sync.sh scripts/ship-joinquest.sh scripts/sync-developer-docs.sh; do
          echo "Validating $script"
          bash -n "$script" || (echo "Syntax error in $script" && exit 1)
        done
