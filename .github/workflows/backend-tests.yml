name: Backend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'scripts/db.sh'
      - 'scripts/lib/db-runtime.sh'
      - 'scripts/ensure-test-database.sh'
      - 'scripts/check-concurrent-test-isolation.sh'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'scripts/db.sh'
      - 'scripts/lib/db-runtime.sh'
      - 'scripts/ensure-test-database.sh'
      - 'scripts/check-concurrent-test-isolation.sh'
      - '.github/workflows/backend-tests.yml'

env:
  # Integration tests and CI migrations use joinquest_test so dev seed data is isolated.
  DATABASE_URL: postgres://app:app-pass@127.0.0.1:5432/joinquest_test?sslmode=disable

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
        cache-dependency-path: backend/go.sum

    - name: Install dependencies
      run: |
        cd backend
        go mod download

    - name: Check gofmt formatting
      run: |
        cd backend
        make fmt-check

    - name: Run go vet
      run: |
        cd backend
        go vet ./...

    - name: Validate docker compose configuration
      run: docker compose config --quiet

    # Guards the isolation that lets several agents run the suite at once —
    # notably that nobody re-pins the host ports back to 5432/6379 (JQ-128).
    - name: Check concurrent test isolation
      run: ./scripts/check-concurrent-test-isolation.sh

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app-pass
          POSTGRES_DB: joinquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d joinquest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
        cache-dependency-path: backend/go.sum

    - name: Install dependencies
      run: |
        cd backend
        go mod download

    - name: Check for gqlgen drift
      run: |
        cd backend
        make check-drift

    - name: Create test database
      run: ./scripts/ensure-test-database.sh

    - name: Run database migrations
      run: |
        cd backend
        make migrate-up

    - name: Run all tests
      run: |
        cd backend
        make test-all

    - name: Test migration rollback and re-apply
      run: |
        cd backend
        make migrate-down
        make migrate-up

    - name: Start backend and verify health check
      run: |
        cd backend
        go build -o server server.go
        ./server &
        SERVER_PID=$!
        cleanup() {
          kill $SERVER_PID 2>/dev/null || true
        }
        trap cleanup EXIT

        for i in {1..30}; do
          if curl -sf http://localhost:8080/healthz | grep -q ok; then
            echo "Backend health check passed"
            exit 0
          fi
          sleep 1
        done

        echo "Backend failed health check"
        exit 1

  docker:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app-pass
          POSTGRES_DB: joinquest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d joinquest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend Docker image
      run: docker build -t joinquest-backend:test backend/

    - name: Create test database
      run: ./scripts/ensure-test-database.sh

    - name: Run migrations in container
      run: |
        docker run --rm --network host \
          -e DATABASE_URL="${DATABASE_URL}" \
          joinquest-backend:test ./migrate -action=up

    - name: Start backend container and verify health check
      run: |
        docker run -d --name joinquest-backend-test --network host \
          -e DATABASE_URL="${DATABASE_URL}" \
          joinquest-backend:test ./main

        cleanup() {
          docker rm -f joinquest-backend-test 2>/dev/null || true
        }
        trap cleanup EXIT

        for i in {1..30}; do
          if curl -sf http://localhost:8080/healthz | grep -q ok; then
            echo "Container health check passed"
            exit 0
          fi
          sleep 1
        done

        echo "Container failed health check"
        docker logs joinquest-backend-test
        exit 1
