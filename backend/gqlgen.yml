schema:
  - graph/schema/*.graphqls
exec:
  filename: graph/generated/generated.go
  package: generated
model:
  filename: graph/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: graph
  package: graph
models:
  UUID:
    model: [github.com/google/uuid.UUID]
  JSON:
    model: [github.com/99designs/gqlgen/graphql.Map]
  Game:
    fields:
      activeSessions:
        resolver: true
      playerActivity:
        resolver: true
      integrationChecks:
        resolver: true
      modes:
        resolver: true
  GameMode:
    fields:
      seats:
        resolver: true
      queuePaths:
        resolver: true
      queues:
        resolver: true
      eligibility:
        resolver: true
      preQueueGroups:
        resolver: true
      queueOptions:
        resolver: true
  ModeQueue:
    fields:
      waitingCount:
        resolver: true
      estimatedWaitSeconds:
        resolver: true
      waitEstimatesByPath:
        resolver: true
  PublicPlayer:
    fields:
      # Forced to a resolver, not bound to a model field. The mode argument
      # needs one, and so does the service-auth gate: PublicPlayer is reached
      # from player-facing types too (Table.user, MatchSeat.user), so the check
      # has to sit on this field rather than on the paths that lead to it.
      skill:
        resolver: true
  Session:
    fields:
      game:
        resolver: true
      players:
        resolver: true
  User:
    fields:
      isAdmin:
        resolver: true
      emails:
        resolver: true
      identities:
        resolver: true
  Room:
    fields:
      host:
        resolver: true
      members:
        resolver: true
      messages:
        resolver: true
      joinUrl:
        resolver: true
      tables:
        resolver: true
  RoomMessage:
    fields:
      author:
        resolver: true
  ActiveIntent:
    fields:
      estimatedWaitSeconds:
        resolver: true
      formingGaps:
        resolver: true
  MyTableSeat:
    fields:
      backfillActive:
        resolver: true
      formingGaps:
        resolver: true
  Table:
    # Not a schema field: the table already knows which finished match it came from by the
    # time the model is built, so regroupRoster reads it here instead of asking the
    # database on every render of every table in the room (JQ-177).
    extraFields:
      OriginSessionID:
        type: "*github.com/google/uuid.UUID"
        description: "The finished match this table is regrouping from, or nil for an ordinary table."
    fields:
      game:
        resolver: true
      mode:
        resolver: true
      king:
        resolver: true
      seats:
        resolver: true
      seatSlots:
        resolver: true
      canStart:
        resolver: true
      canDiscard:
        resolver: true
      lookForGroupOptions:
        resolver: true
      backfillActive:
        resolver: true
      formingGaps:
        resolver: true
      regroupRoster:
        resolver: true
  TableSeat:
    fields:
      user:
        resolver: true
  TableSeatSlot:
    fields:
      user:
        resolver: true
